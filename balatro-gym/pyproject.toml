[project]
name = "balatro-gym"
version = "0.1.0"
description = "A live Round Tactics environment for Balatro"
requires-python = ">=3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["balatro_gym"]
